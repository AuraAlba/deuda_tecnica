name: Quality Gate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Inspección de Calidad y Tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Gate 1 - Verificación Estática (Linter)
        run: npm run lint

      - name: Gate 2 - Auditoría de Seguridad de Dependencias
        run: npm audit --audit-level=high

      - name: Gate 3 & 4 - Pruebas Unitarias y Cobertura Mínima (>=80%)
        run: |
          # Ejecuta las pruebas exigiendo el umbral mínimo de cobertura de código
          npm test -- --coverage --coverage-report=text --check-coverage --lines 80
          