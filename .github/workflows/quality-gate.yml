name: Quality Gate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Inspección de Calidad y Tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: taller-casa/fastpay-service/package-lock.json

      - name: Instalar Dependencias
        run: npm ci
        working-directory: ./taller-casa/fastpay-service

      - name: 1. Inspección Estática (Linter)
        run: npm run lint
        working-directory: ./taller-casa/fastpay-service

      - name: 2. Auditoría de Seguridad de Dependencias
        run: npm audit --audit-level=high
        working-directory: ./taller-casa/fastpay-service

      - name: 3. Ejecución de Pruebas Unitarias
        run: npm test
        working-directory: ./taller-casa/fastpay-service